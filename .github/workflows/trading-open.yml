name: Trading — Market Open (9:30 AM ET)

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 9:30 AM ET, Mon–Fri
  workflow_dispatch:           # manual trigger for testing

permissions:
  contents: write

jobs:
  trade-open:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run trading agent — open session
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:   https://paper-api.alpaca.markets/v2
          ALPACA_DATA_URL:   https://data.alpaca.markets/v2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/trading_agent.py --session open

      - name: Commit results
        run: |
          git config user.email "trading-bot@github-actions"
          git config user.name "Trading Bot"
          git pull --rebase origin main
          git add trades/
          git diff --staged --quiet || git commit -m "exec_open: $(date -u +%Y-%m-%d)"
          git push

name: Trading — End of Day (4:30 PM ET)

on:
  schedule:
    - cron: '30 20 * * 1-5'   # 4:30 PM ET, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Run trading agent — EOD session
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:   https://paper-api.alpaca.markets/v2
          ALPACA_DATA_URL:   https://data.alpaca.markets/v2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/trading_agent.py --session eod

      - name: Commit results
        run: |
          git config user.email "trading-bot@github-actions"
          git config user.name "Trading Bot"
          git add trades/
          git pull --rebase --autostash origin main
          git diff --staged --quiet || git commit -m "exec_eod: $(date -u +%Y-%m-%d)"
          git push
